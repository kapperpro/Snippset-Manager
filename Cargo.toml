[package]
name = "snippet-manager"
version = "0.6.0"
edition = "2021"
description = "Snippet- und Clipboard-Manager"

[dependencies]
eframe = "0.29"
arboard = "3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.19"
raw-window-handle = "0.6"
winreg = "0.52"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

# Optimiertes, "sauberes" Release-Profil. Wichtig: Das senkt Antivirus-Fehlalarme
# nur begrenzt (siehe Erklärung in der Antwort) – entscheidend sind Signatur,
# Versionsinformationen und Verzicht auf Packer wie UPX.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
debug = false
